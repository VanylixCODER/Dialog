services:
  app:
    build: .
    container_name: dialog-app
    restart: unless-stopped
    env_file: .env
    environment:
      - HOST_REPO_PATH=/repo
      - UPLOAD_DIR=/data/uploads
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/.ssh:/root/.ssh:ro
      - /home/ubuntu/dialog:/repo
      # Message attachments live here as files (hash-named), NOT as base64 in MySQL.
      - dialog-uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    image: caddy:2
    container_name: dialog-caddy
    restart: unless-stopped
    ports:
      - "443:443"          # port 80 now belongs to the TURN relay (see coturn below)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public/errors:/srv/errors:ro
      - dialog-caddy-data:/data
    depends_on:
      - app

  # Own TURN relay, so calls between networks that block direct connections still work — free,
  # no quota, no third party. It listens on TCP 80 (already open on the host's cloud firewall,
  # unlike 3478/UDP ranges), and both callers connect to it over TCP; the relay passes the media
  # between them inside this container. Credentials are short-lived HMACs made by the app
  # (TURN_SECRET in .env). It sits on its own network so it can't reach mysql/redis.
  coturn:
    image: coturn/coturn:latest
    container_name: dialog-coturn
    restart: unless-stopped
    ports:
      - "80:3478/tcp"
    networks: [turnnet]
    command: >
      -n --log-file=stdout --no-tls --no-udp --listening-port=3478 --realm=dialogmsg.xyz
      --use-auth-secret --static-auth-secret=${TURN_SECRET} --fingerprint --no-multicast-peers
      --user-quota=8 --total-quota=300 --no-tcp-relay

  mysql:
    image: mysql:8
    container_name: dialog-mysql
    restart: unless-stopped
    # Low-memory tuning for the 1 GB box. The big saver is performance_schema=OFF
    # (~150-300 MB) + O_DIRECT (no double-caching with the OS). Keeping MySQL in
    # real RAM avoids swap thrash, which is what actually slows queries here.
    command: >
      --performance-schema=OFF
      --innodb-buffer-pool-size=128M
      --innodb-buffer-pool-instances=1
      --innodb-log-buffer-size=8M
      --innodb-flush-method=O_DIRECT
      --max-connections=60
      --table-open-cache=256
      --tmp-table-size=16M
      --max-heap-table-size=16M
      --host-cache-size=0
      --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dialog-mysql-data:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD}
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: dialog-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - dialog-redis-data:/data

volumes:
  dialog-uploads:
  dialog-mysql-data:
  dialog-redis-data:
  dialog-certs:
  dialog-caddy-data:

networks:
  turnnet: {}
