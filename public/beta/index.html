<!DOCTYPE html>
<html lang="en" data-theme="dialog">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dialog · 1.1.0 (beta)</title>
  <meta name="theme-color" content="#00ff5a" />
  <link rel="icon" href="/src/lil_dialog.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.6.14/daisyui.css" />
  <link rel="stylesheet" href="/beta/beta.css" />
</head>
<body>
  <canvas id="matrix-bg"></canvas>

  <!-- ░░ LOGIN ░░ -->
  <section id="login" class="login-wrap">
    <div class="card login-card">
      <div class="brand"><img src="/src/lil_dialog.webp" alt="" /><div><b>Dialog</b><span class="badge badge-sm badge-primary">1.1.0 beta</span></div></div>
      <p class="muted">The next Dialog — rebuilt from scratch.</p>
      <div class="stack-form" id="li-form">
        <label class="ipt"><span data-ic="user"></span><input id="li-login" placeholder="Login or email" autocomplete="username" /></label>
        <label class="ipt"><span data-ic="lock"></span><input id="li-pass" type="password" placeholder="Password" autocomplete="current-password" /><button id="li-eye" class="eye" type="button" data-ic="eye"></button></label>
        <div id="li-err" class="err"></div>
        <button id="li-go" class="btn btn-primary btn-block">Sign in</button>
        <a id="to-reg" class="link muted sm">Create an account →</a>
        <a href="/login" class="link muted sm">Use the classic app →</a>
      </div>
      <div class="stack-form hidden" id="rg-form">
        <label class="ipt"><span data-ic="user"></span><input id="rg-login" placeholder="Login (letters, digits, _)" autocomplete="username" /></label>
        <label class="ipt"><span data-ic="smile"></span><input id="rg-name" placeholder="Display name" /></label>
        <label class="ipt"><span data-ic="send"></span><input id="rg-email" type="email" placeholder="Email" autocomplete="email" /></label>
        <label class="ipt"><span data-ic="lock"></span><input id="rg-pass" type="password" placeholder="Password" autocomplete="new-password" /></label>
        <div id="rg-err" class="err"></div>
        <button id="rg-go" class="btn btn-primary btn-block">Create account</button>
        <a id="to-li" class="link muted sm">← Back to sign in</a>
      </div>
    </div>
  </section>

  <!-- ░░ APP ░░ -->
  <main id="app" class="shell hidden">
    <nav class="rail">
      <img class="rail-logo" src="/src/lil_dialog.webp" alt="" />
      <button class="rail-btn active" data-nav="chats" data-ic="chat" data-tip="Chats"></button>
      <button class="rail-btn" data-nav="contacts" data-ic="users" data-tip="Contacts"></button>
      <button class="rail-btn" data-nav="theme" data-ic="palette" data-tip="Themes"></button>
      <span class="rail-sp"></span>
      <button class="rail-btn" data-nav="settings" data-ic="gear" data-tip="Settings"></button>
      <button class="rail-me avatar" id="me-ava"></button>
    </nav>

    <aside class="list">
      <header class="list-head">
        <label class="search ipt"><span data-ic="search"></span><input id="q" placeholder="Search people & chats…" /></label>
      </header>
      <div class="filters" id="filters">
        <button class="chip active" data-f="all">All</button>
        <button class="chip" data-f="dm">DMs</button>
        <button class="chip" data-f="online">Online</button>
        <button class="chip" data-f="group">Groups</button>
      </div>
      <ul id="chats" class="rows"></ul>
      <div id="people" class="rows hidden"></div>
      <div id="suggest" class="suggest hidden"></div>
    </aside>

    <section class="chat">
      <div id="empty" class="empty"><img src="/src/dialoglogo.webp" alt="" /><p class="muted">Pick a conversation</p></div>
      <div id="conv" class="conv hidden">
        <header class="conv-head">
          <button class="icon-btn only-mobile" id="c-back" data-ic="back"></button>
          <button class="avatar" id="c-ava"></button>
          <div class="c-meta"><b id="c-name">—</b><small id="c-sub" class="muted"></small></div>
          <button class="icon-btn" id="c-call" data-ic="phone" data-tip="Voice call"></button>
          <button class="icon-btn" id="c-video" data-ic="video" data-tip="Video call"></button>
        </header>
        <div id="msgs" class="msgs"></div>
        <div id="typing" class="typing muted hidden"></div>
        <footer class="composer">
          <button class="icon-btn" id="c-attach" data-ic="clip" data-tip="Attach"></button>
          <input id="c-input" class="c-input" placeholder="Message…" autocomplete="off" />
          <button class="icon-btn send" id="c-send" data-ic="send"></button>
        </footer>
        <div id="tray" class="file-tray hidden"></div>
      </div>
    </section>

    <nav class="dock only-mobile">
      <button class="dock-btn active" data-nav="chats" data-ic="chat"><span>Chats</span></button>
      <button class="dock-btn" data-nav="contacts" data-ic="users"><span>People</span></button>
      <button class="dock-btn" data-nav="theme" data-ic="palette"><span>Theme</span></button>
      <button class="dock-btn" data-nav="settings" data-ic="gear"><span>You</span></button>
    </nav>
  </main>

  <!-- Settings drawer -->
  <div id="settings" class="sheet hidden">
    <div class="sheet-card">
      <header class="sheet-head"><b id="set-title">Settings</b><button class="icon-btn" id="set-close" data-ic="x"></button></header>
      <div class="sheet-body" id="set-body"></div>
    </div>
  </div>

  <!-- Mini-profile (right-mirrored Discord card) -->
  <div id="mp" class="sheet hidden">
    <div class="mp-card">
      <div class="mp-banner"></div>
      <button class="icon-btn mp-x" id="mp-close" data-ic="x"></button>
      <div class="mp-ava avatar" id="mp-ava"></div>
      <div class="mp-body">
        <div class="mp-name"><b id="mp-name">—</b><span id="mp-tag" class="muted"></span></div>
        <div id="mp-status" class="mp-status"></div>
        <div class="divider-line"></div>
        <div id="mp-desc" class="mp-desc muted"></div>
        <div id="mp-joined" class="muted sm"></div>
        <div class="mp-actions">
          <button class="btn btn-primary btn-sm" id="mp-msg">Message</button>
          <button class="btn btn-ghost btn-sm" id="mp-add">Add friend</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Incoming call -->
  <div id="incoming" class="incoming hidden">
    <div class="inc-card">
      <div class="inc-ava avatar" id="inc-ava"></div>
      <b id="inc-name">—</b><span class="muted" id="inc-sub">Incoming call…</span>
      <div class="inc-btns">
        <button class="inc-b decline" id="inc-decline" data-ic="phoneOff"></button>
        <button class="inc-b accept" id="inc-accept" data-ic="phone"></button>
      </div>
    </div>
  </div>

  <!-- Call stage (Discord-style adaptive) -->
  <div id="call" class="call hidden">
    <header class="call-head">
      <b id="call-title">Call</b><span class="call-timer" id="call-timer">00:00</span>
      <button class="call-fs" id="call-fs" data-ic="expand" title="Big screen"></button>
    </header>
    <div id="tiles" class="tiles"></div>
    <footer class="call-bar">
      <button class="call-btn" id="cb-mic" data-ic="mic" data-tip="Mute"></button>
      <button class="call-btn" id="cb-cam" data-ic="video" data-tip="Camera"></button>
      <button class="call-btn hang" id="cb-hang" data-ic="phoneOff" data-tip="Leave"></button>
    </footer>
  </div>

  <!-- New group -->
  <div id="gnew" class="sheet hidden">
    <div class="sheet-card">
      <header class="sheet-head"><b>New group</b><button class="icon-btn" id="gnew-close" data-ic="x"></button></header>
      <div class="sheet-body" id="gnew-body"></div>
    </div>
  </div>

  <!-- Generic popup menu (contacts / chat rows) -->
  <div id="ctx-menu" class="msg-menu hidden"></div>

  <!-- Message context menu + reaction picker -->
  <div id="msg-menu" class="msg-menu hidden">
    <div class="react-row" id="react-row"></div>
    <button class="mm-item" data-act="copy"><span data-ic="clip"></span> Copy text</button>
    <button class="mm-item own" data-act="edit"><span data-ic="gear"></span> Edit</button>
    <button class="mm-item own danger" data-act="delete"><span data-ic="x"></span> Delete</button>
  </div>

  <input id="filepick" type="file" accept="*/*" multiple hidden />
  <div id="toasts" class="toast toast-top toast-end"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
  <script src="/beta/icons.js"></script>
  <script src="/beta/beta.js"></script>
</body>
</html>
