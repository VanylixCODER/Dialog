<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password · Dialog</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #050b06; color: #d6e6dc;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .card { width: min(92vw, 400px); background: #0b140d; border: 1px solid #1c3324;
      border-radius: 16px; padding: 28px 26px; }
    .brand { color: #2ec96b; font-weight: 800; font-size: 20px; letter-spacing: .5px; }
    h1 { font-size: 19px; margin: 14px 0 4px; color: #fff; }
    p { color: #a9c2b3; font-size: 13.5px; line-height: 1.5; margin: 0 0 18px; }
    label { display: block; font-size: 12px; color: #8fb3a0; margin: 12px 0 6px; }
    input { width: 100%; padding: 12px 14px; font-size: 15px; color: #eafff1;
      background: #06110a; border: 1px solid #1c3324; border-radius: 10px; outline: none; }
    input:focus { border-color: #2ec96b; }
    button { width: 100%; margin-top: 18px; padding: 12px; font-size: 15px; font-weight: 700;
      color: #04180c; background: #2ec96b; border: none; border-radius: 10px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .msg.err { color: #ff6b6b; } .msg.ok { color: #2ec96b; }
    a.open { display: inline-block; margin-top: 16px; color: #2ec96b; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Dialog</div>
    <h1>Reset your password</h1>
    <p>Choose a new password for your account.</p>
    <form id="form">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="6" required />
      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="6" required />
      <button id="btn" type="submit">Reset password</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>
  <script>
    var token = new URLSearchParams(location.search).get("token") || "";
    var form = document.getElementById("form"), msg = document.getElementById("msg"), btn = document.getElementById("btn");
    if (!token) { form.style.display = "none"; msg.className = "msg err"; msg.textContent = "Invalid or missing reset link."; }
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      msg.textContent = ""; msg.className = "msg";
      var pw = document.getElementById("pw").value, pw2 = document.getElementById("pw2").value;
      if (pw.length < 6) { msg.className = "msg err"; msg.textContent = "Password must be at least 6 characters."; return; }
      if (pw !== pw2) { msg.className = "msg err"; msg.textContent = "Passwords don't match."; return; }
      btn.disabled = true;
      fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: token, password: pw }) })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok) {
            btn.disabled = false; msg.className = "msg err";
            // The server answers with codes; this standalone page carries its own
            // tiny map rather than pulling in the whole app dictionary.
            var CODES = { reset_link_invalid: "This link is invalid or has expired." };
            msg.textContent = CODES[res.d && res.d.error] || (res.d && res.d.error) || "Reset failed.";
            return;
          }
          form.style.display = "none";
          msg.className = "msg ok";
          msg.innerHTML = "Password updated. You can sign in now.<br><a class='open' href='/login'>Open Dialog</a>";
        })
        .catch(function () { btn.disabled = false; msg.className = "msg err"; msg.textContent = "Network error — try again."; });
    });
  </script>
</body>
</html>
