<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join a group — Dialog</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#00ff5a" />
  <link rel="icon" href="/src/lil_dialog.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    body {
      background-image: linear-gradient(#151b17 1px, transparent 1px),
                        linear-gradient(90deg, #151b17 1px, transparent 1px);
      background-size: 56px 56px;
    }
    .join-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .join-card { width: min(420px, 94vw); padding: 32px 28px; text-align: center;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
    .join-ava { width: 72px; height: 72px; margin: 0 auto 18px; display: grid; place-items: center; overflow: hidden;
      background: var(--band); border: 1px solid var(--band-line); border-radius: var(--r);
      color: var(--green); font: 600 28px/1 Inter, sans-serif; }
    .join-ava img { width: 100%; height: 100%; object-fit: cover; }
    .join-eyebrow { margin-bottom: 10px; font: 400 11px/1 var(--mono); letter-spacing: .18em; color: var(--green); text-transform: uppercase; }
    .join-name { margin: 0 0 8px; font: 600 24px/1.2 Inter, sans-serif; letter-spacing: -.02em; word-break: break-word; }
    .join-meta { margin-bottom: 24px; font: 400 12px/1.6 var(--mono); color: var(--dim); }
    .join-btn { display: block; width: 100%; margin-top: 10px; padding: 12px;
      font: 500 14px/1.2 Inter, sans-serif; border: 1px solid transparent; border-radius: var(--r); cursor: pointer; }
    .join-primary { color: var(--green); border-color: var(--green); background: transparent; box-shadow: 0 0 24px rgba(0, 255, 90, .18); }
    .join-primary:hover { background: rgba(0, 255, 90, .12); }
    .join-secondary { background: transparent; border-color: var(--line-3); color: var(--text); }
    .join-secondary:hover { border-color: var(--green-2); color: var(--green-2); }
    .join-hint { margin-top: 18px; font-size: 12px; line-height: 1.6; color: var(--dim); }
    .join-hint a { color: var(--green-2); }
    .spin { width: 30px; height: 30px; margin: 20px auto; border: 2px solid var(--line);
      border-top-color: var(--green); border-radius: 50%; animation: sp .8s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    .brand-top { position: fixed; top: 20px; left: 24px; }
    .brand-top img { height: 28px; width: auto; display: block; }
  </style>
</head>
<body>
  <a class="brand-top" href="/"><img src="/src/landing/logo.webp" alt="Dialog" /></a>

  <div class="join-wrap">
    <div class="join-card">
      <div id="loading"><div class="spin"></div><div class="join-meta">Loading invite…</div></div>

      <div id="invalid" class="hidden">
        <div class="join-ava">⚠</div>
        <div class="join-name" id="invalidTitle">Invite unavailable</div>
        <div class="join-meta" id="invalidMsg"></div>
        <a class="join-btn join-secondary" href="/login">Open Dialog</a>
      </div>

      <div id="offer" class="hidden">
        <div class="join-ava" id="gAva">#</div>
        <div class="join-eyebrow">You're invited to join</div>
        <h1 class="join-name" id="gName">Group</h1>
        <div class="join-meta" id="gMeta"></div>
        <button class="join-btn join-primary" id="joinBtn">Join group</button>
        <button class="join-btn join-secondary" id="appBtn">Open in Dialog app</button>
        <div class="join-hint" id="hint"></div>
      </div>

      <div id="working" class="hidden"><div class="spin"></div><div class="join-meta" id="workingMsg">Joining…</div></div>
    </div>
  </div>

  <script>
    (function () {
      // /invite/<code> or /join/<code>
      var code = decodeURIComponent((location.pathname.split("/").filter(Boolean)[1] || ""));
      var group = null;
      var $ = function (id) { return document.getElementById(id); };
      function show(id) { ["loading", "invalid", "offer", "working"].forEach(function (s) { $(s).classList.toggle("hidden", s !== id); }); }
      function token() { try { return localStorage.getItem("dialog_token"); } catch (e) { return null; } }

      function fail(status) {
        show("invalid");
        var m = { expired: "This invite link has expired.", used_up: "This invite link has reached its use limit.", invalid: "This invite link is invalid or was revoked." };
        $("invalidMsg").textContent = m[status] || m.invalid;
      }

      // Load the group preview.
      if (!code) { fail("invalid"); return; }
      fetch("/api/invite/" + encodeURIComponent(code))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d || !d.ok) { fail(d && d.status); return; }
          group = d.group;
          $("gName").textContent = group.name;
          $("gAva").textContent = (group.name || "#").trim().charAt(0).toUpperCase() || "#";
          var bits = [group.members + (group.members === 1 ? " member" : " members")];
          if (d.remaining != null) bits.push(d.remaining + " use" + (d.remaining === 1 ? "" : "s") + " left");
          $("gMeta").textContent = bits.join(" · ");
          $("joinBtn").textContent = token() ? "Join group" : "Sign in & join";
          $("hint").innerHTML = "Not in Dialog? <a href='/download'>Get the app</a> or continue in your browser.";
          show("offer");
        })
        .catch(function () { fail("invalid"); });

      // Join via the web app (works in-app too — same origin).
      function webJoin() {
        var tk = token();
        if (!tk) { location.href = "/login?invite=" + encodeURIComponent(code); return; }
        show("working");
        fetch("/api/groups/redeem", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + tk },
          body: JSON.stringify({ code: code })
        }).then(function (r) { return r.json(); }).then(function (d) {
          if (d.loginRequired) { location.href = "/login?invite=" + encodeURIComponent(code); return; }
          if (d.status === "joined" || d.status === "already") { location.href = "/en/group/" + d.group; return; }
          fail(d.status);
        }).catch(function () { show("offer"); });
      }

      // Try to open the native app via deep link; if it doesn't take over, fall back to browser.
      function openInApp() {
        var opened = false;
        var onHide = function () { if (document.hidden) opened = true; };
        document.addEventListener("visibilitychange", onHide);
        // Desktop registers dialog://; if nothing handles it, we quietly continue in the browser.
        try { location.href = "dialog://join/" + encodeURIComponent(code); } catch (e) {}
        setTimeout(function () {
          document.removeEventListener("visibilitychange", onHide);
          if (!opened) webJoin(); // no app grabbed it → join in the browser
        }, 1300);
      }

      $("joinBtn").addEventListener("click", webJoin);
      $("appBtn").addEventListener("click", openInApp);
    })();
  </script>
</body>
</html>
