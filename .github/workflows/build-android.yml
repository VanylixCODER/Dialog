name: Build Android (.apk)

# Builds the Android release APK and uploads it to the GitHub Release.
# A keystore is generated on the fly (ephemeral) so the APK is signed and
# installable. For stable update signing, provide a real keystore via secrets
# (ANDROID_KEYSTORE_B64 + passwords) and adapt the "Prepare keystore" step.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload the APK to"
        required: true
        default: "v1.0.1"
  push:
    tags:
      - "apk-*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # google-services.json is gitignored (secret), so materialise it from the repo
      # secret — the google-services Gradle plugin fails the build without it.
      - name: Firebase config
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GS_B64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_B64 secret is missing — FCM build cannot proceed."
            exit 1
          fi
          echo "$GS_B64" | base64 -d > android/app/google-services.json
          echo "wrote android/app/google-services.json ($(wc -c < android/app/google-services.json) bytes)"

      # The PERMANENT Play upload key. Play binds the app to one upload certificate
      # forever, so this must never be regenerated (previously CI made a throwaway key
      # each run, which would have made every post-launch update rejectable).
      - name: Prepare signing keystore
        id: ks
        env:
          KS_B64: ${{ secrets.DIALOG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::DIALOG_KEYSTORE_B64 secret missing — refusing to build with a throwaway key."
            exit 1
          fi
          KS="$RUNNER_TEMP/upload-keystore.jks"
          echo "$KS_B64" | base64 -d > "$KS"
          echo "path=$KS" >> "$GITHUB_OUTPUT"

      # APK for direct download/sideload + AAB for the Play Store (Play requires .aab).
      - name: Build release APK + AAB
        working-directory: android
        env:
          DIALOG_KEYSTORE: ${{ steps.ks.outputs.path }}
          DIALOG_KS_PASS: ${{ secrets.DIALOG_KS_PASS }}
          DIALOG_KEY_ALIAS: ${{ secrets.DIALOG_KEY_ALIAS }}
          DIALOG_KEY_PASS: ${{ secrets.DIALOG_KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Stage APK + AAB
        id: stage
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          mkdir -p out
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "out/Dialog-${VER}.apk"
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          cp "$AAB" "out/Dialog-${VER}.aab"
          echo "Built APK: $APK"
          echo "Built AAB: $AAB (upload THIS to Play Console)"

      - uses: actions/upload-artifact@v4
        with:
          name: dialog-android
          path: |
            out/*.apk
            out/*.aab

      # Only the APK goes on the public release (sideload). The AAB stays a build
      # artifact — it's for uploading to Play Console, not for end users.
      - name: Attach APK to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || format('v{0}', steps.stage.outputs.version) }}
        run: |
          # Create as a PRE-RELEASE when this Android-only build is first to publish the tag:
          # an APK-only release has no latest.yml, so it must never become GitHub's "latest"
          # (electron-updater reads /releases/latest and would 404 on latest.yml). A later
          # desktop publish (publish-dist.sh) promotes the same tag to latest.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Dialog $TAG" --notes "Release" --prerelease
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber out/*.apk
